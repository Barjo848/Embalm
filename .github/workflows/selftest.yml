name: Self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run the 36-check suite
        run: swift run embalm-selftest
      - name: Build the app and the command-line tool
        run: swift build -c release
